name: learnato-forum

databases:
  - name: learnato-db
    databaseName: learnato_forum
    plan: free

services:
  - type: web
    name: learnato-backend
    env: docker
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: learnato-db
          property: connectionString
      - key: PORT
        value: "4000"
      - key: CORS_ORIGIN
        value: "*"

  - type: web
    name: learnato-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_BASE
        value: https://learnato-backend.onrender.com

