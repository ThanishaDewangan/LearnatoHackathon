services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learnato_forum
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/learnato_forum?schema=public
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      - db
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    environment:
      - VITE_API_BASE=http://localhost:4000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  dbdata:

